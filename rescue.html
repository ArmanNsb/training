<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Training – repair</title>
<style>
  body{margin:0;background:#09090b;color:#eee;font:15px/1.7 system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;padding:20px}
  h1{font-size:20px;margin:0 0 6px}
  .card{background:#18181b;border:1px solid #27272a;border-radius:14px;padding:14px 16px;margin:14px 0}
  button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;font:600 15px system-ui,Tahoma,sans-serif;cursor:pointer}
  .main{background:#c5f467;color:#111}
  .sec{background:#27272a;color:#eee}
  .danger{background:#3f1d1d;color:#fca5a5}
  pre{white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;color:#a1a1aa;margin:0}
  small{color:#a1a1aa}
  #msg{color:#c5f467;min-height:1.5em}
  a{color:#c5f467}
</style>
</head>
<body>
<h1>صفحهٔ تعمیر اپ تمرین</h1>
<small>این صفحه اطلاعات تمرین‌های ذخیره‌شده در همین گوشی را نشان می‌دهد و می‌تواند نسخهٔ آفلاین خراب را پاک کند.</small>

<div class="card"><b>وضعیت این گوشی</b><pre id="info">در حال بررسی…</pre></div>

<p id="msg"></p>

<button class="main" id="backup">۱. دانلود پشتیبان از تمرین‌ها</button>
<button class="sec" id="reset">۲. پاک کردن نسخهٔ آفلاین (تمرین‌ها پاک نمی‌شوند)</button>
<button class="sec" id="test">۳. امتحان اجرای اپ و نمایش خطا</button>
<button class="danger" id="wipe">پاک کردن همه‌چیز، حتی تمرین‌ها (فقط بعد از پشتیبان)</button>

<div class="card" id="testBox" hidden><b>نتیجهٔ امتحان</b><pre id="testOut"></pre></div>

<p><a href="./">بازگشت به اپ</a></p>

<script>
var $=function(id){return document.getElementById(id)};
function msg(t){$('msg').textContent=t}
function raw(k){try{return localStorage.getItem(k)}catch(e){return null}}
function parse(k){try{return JSON.parse(raw(k))}catch(e){return null}}

async function info(){
  var lines=[];
  try{
    var keys=[];for(var i=0;i<localStorage.length;i++)keys.push(localStorage.key(i));
    var w=parse('gp.workouts');
    lines.push('Saved workouts: '+(w&&typeof w==='object'?Object.keys(w).length:0));
    lines.push('Storage keys: '+(keys.filter(function(k){return k.indexOf('gp.')===0}).map(function(k){return k+' ('+Math.round((raw(k)||'').length/1024)+' KB)'}).join(', ')||'none'));
  }catch(e){lines.push('Storage error: '+e.message)}
  try{
    if('serviceWorker' in navigator){var r=await navigator.serviceWorker.getRegistrations();lines.push('Offline workers: '+r.length)}
    else lines.push('Offline workers: not supported');
  }catch(e){lines.push('Worker error: '+e.message)}
  try{if(window.caches){var c=await caches.keys();lines.push('Offline caches: '+(c.join(', ')||'none'))}}catch(e){lines.push('Cache error: '+e.message)}
  lines.push('Browser: '+navigator.userAgent);
  $('info').textContent=lines.join('\n');
}

$('backup').onclick=function(){
  var data={app:'gp',v:4,exportedAt:new Date().toISOString(),workouts:parse('gp.workouts')||{},settings:parse('gp.settings')||{}};
  var log=parse('gp.log');if(log){data.log=log;data.abs=parse('gp.abs')||{}}
  var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='workout-backup-rescue-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000);
  msg('فایل پشتیبان دانلود شد. بعداً از تنظیمات اپ، گزینهٔ Restore را بزنید.');
};

$('reset').onclick=async function(){
  try{
    if('serviceWorker' in navigator){var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(x){return x.unregister()}))}
    if(window.caches){var k=await caches.keys();await Promise.all(k.map(function(x){return caches.delete(x)}))}
    msg('نسخهٔ آفلاین پاک شد. حالا مرورگر را کامل ببندید و دوباره سایت را باز کنید.');
  }catch(e){msg('خطا: '+e.message)}
  info();
};

$('test').onclick=function(){
  $('testBox').hidden=false;$('testOut').textContent='Loading…';
  var f=document.createElement('iframe');f.style.cssText='width:1px;height:1px;border:0;position:absolute;left:-9999px';
  f.src='./index.html?rescue='+Date.now();
  f.onload=function(){setTimeout(function(){
    var out=[];
    try{
      var d=f.contentDocument,app=d.getElementById('app');
      out.push(app&&app.children.length&&!d.getElementById('bootErr')?'The app started normally in this test.':'The app did NOT start.');
      var errs=f.contentWindow.__errs||[];out.push(errs.length?'Errors:\n'+errs.join('\n'):'No errors reported.');
    }catch(e){out.push('Test error: '+e.message)}
    $('testOut').textContent=out.join('\n');f.remove();
  },2500)};
  document.body.appendChild(f);
};

$('wipe').onclick=async function(){
  if(!confirm('همهٔ تمرین‌های ذخیره‌شده در این گوشی پاک می‌شوند. اول پشتیبان گرفتید؟'))return;
  try{
    Object.keys(localStorage).forEach(function(k){if(k.indexOf('gp.')===0)localStorage.removeItem(k)});
    if('serviceWorker' in navigator){var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(x){return x.unregister()}))}
    if(window.caches){var k=await caches.keys();await Promise.all(k.map(function(x){return caches.delete(x)}))}
    msg('همه‌چیز پاک شد. مرورگر را ببندید و سایت را دوباره باز کنید.');
  }catch(e){msg('خطا: '+e.message)}
  info();
};

info();
</script>
</body>
</html>
